                  value:
                    isBusinessLicenceRequired: false
                    isPrincipalResidenceRequired: true
                    isStrProhibited: false
                    isStraaExempt: false
        '404':
          description: Not Found
      requestBody:
        content:
          application/json:
            schema:
              type: object
              x-examples:
                Example 1:
                  address:
                    unitNumber: 101a
                    streetNumber: '101'
                    streetName: Test street
                    country: CA
                    postalCode: H0H0H0
                    province: BC
                    city: Test City
              properties:
                address:
                  type: object
                  required:
                    - streetNumber
                    - streetName
                    - country
                    - postalCode
                    - province
                    - city
                  properties:
                    unitNumber:
                      type: string
                    streetNumber:
                      type: string
                    streetName:
                      type: string
                    country:
                      type: string
                    postalCode:
                      type: string
                    province:
                      type: string
                    city:
                      type: string
            examples:
              Example 1:
                value:
                  address:
                    unitNumber: 101a
                    streetNumber: '234'
                    streetName: Test street
                    country: CA
                    postalCode: H0H0H0
                    province: BC
                    city: Test city
        description: Post the address to get the short term rental requirements.
      description: Post the address to get the short term rental requirements for that address.
      x-stoplight:
        id: 4sqp07r1juk5x
      parameters:
        - $ref: '#/components/parameters/Account-Id'
    parameters: []
  '/permits/:batchValidate':
    post:
      summary: Batch Validate Permits and Addresses
      operationId: batch-validate-permit
      x-stoplight:
        id: pxnr153m69yor
      description: |
        Asynchronously validates a batch submission of Short-Term Rental (STR) permits and/or checks address exemptions under the *Short-Term Rental Accommodations Act* (STRAA).

        ### Integration Workflow:
        1. **Submit Batch (`POST /permits/:batchValidate`)**:
           - Submit up to `50,000` permit or address records in the `data` array.
           - Provide `control.count` matching the exact number of items in `data`.
           - Provide a secure `control.callBackUrl` (recommended to include a secret token query parameter).
           - The API returns `202 Accepted` immediately upon successfully queuing the request.
        2. **Receive Completion Webhook**:
           - Once processing finishes, STRR dispatches an HTTP `POST` request to your `callBackUrl` with a temporary presigned Google Cloud Storage URL (`fileUrl`).
           - Your endpoint must respond with `200 OK` within 10 seconds.
        3. **Download Result File**:
           - Perform an HTTP `GET` on `fileUrl` (valid for 7 days) to download the batch validation result JSON file.

        ### Validation Modes per Record in `data`:
        - **Permit Verification Mode (with `identifier`, e.g. `H1234567`)**: Validates the permit status (`ACTIVE`, `EXPIRED`, `SUSPENDED`, `CANCELLED`) and matches the submitted unit number, street number, and postal code against official registry records.
        - **Address Exemption Mode (without `identifier`, address only)**: Checks provincial data to determine if the address is exempt from registration (`isStraaExempt: true | false`).
      parameters:
        - $ref: '#/components/parameters/Account-Id'
      requestBody:
        description: Batch submission payload containing control directives and records to validate.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/batchValidationRequest'
            examples:
              Mixed Batch (Permits & Address Exemptions):
                summary: Batch containing permit validations and address exemption checks
                value:
                  control:
                    count: 2
                    callBackUrl: 'https://platform.example.com/api/v1/strr-callback?token=sec_token_xyz123'
                  data:
                    - identifier: H1234567
                      address:
                        unitNumber: 101A
                        streetNumber: '101'
                        streetName: Main St
                        city: Victoria
                        province: BC
                        postalCode: V8V 1A1
                    - address:
                        streetNumber: '721'
                        streetName: Fort St
                        city: Victoria
                        province: BC
                        postalCode: V8W 1G8
      responses:
        '202':
          description: Batch submission accepted and queued for processing.
          content:
            application/json:
              schema:
                type: object
                example: {}
        '400':
          description: Bad Request - Validation or transmission error (e.g. count mismatch, missing control/data).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiErrorResponse'
              examples:
                Count Mismatch:
                  summary: Count does not match number of records
                  value:
                    errors:
                      - code: INVALID_REQUEST
                        message: Value of 'count' does not match the number of permits submitted for verification.
                Missing Control Attributes:
                  summary: Missing required control attributes
                  value:
                    errors:
                      - code: INVALID_REQUEST
                        message: "'control' object does not have required attributes."
        '401':
          description: Unauthorized - Missing or invalid authentication credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiErrorResponse'
        '403':
          description: Forbidden - Account does not have permission to access batch validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiErrorResponse'
      callbacks:
        batchCompletionNotification:
          '{$request.body#/control/callBackUrl}':
            post:
              summary: Receive completion notification with presigned download URL
              description: |
                Dispatched by STRR upon completion of the batch validation job. Delivers a temporary presigned Google Cloud Storage URL (`fileUrl`) to download the complete batch validation result JSON file.
              requestBody:
                required: true
                content:
                  application/x-www-form-urlencoded:
                    schema:
                      type: object
                      required:
                        - fileUrl
                      properties:
                        fileUrl:
                          type: string
                          format: uri
                          description: Temporary presigned URL to download the validation results JSON file. Valid for 7 days.
                          example: 'https://storage.googleapis.com/strr_bulk_validation_responses_prod/48ad98c4-38ce-426d-bf61-d722fa186f2b?X-Goog-Algorithm=...'
                  application/json:
                    schema:
                      type: object
                      required:
                        - fileUrl
                      properties:
                        fileUrl:
                          type: string
                          format: uri
                          description: Temporary presigned URL to download the validation results JSON file. Valid for 7 days.
                          example: 'https://storage.googleapis.com/strr_bulk_validation_responses_prod/48ad98c4-38ce-426d-bf61-d722fa186f2b?X-Goog-Algorithm=...'
              responses:
                '200':
                  description: Notification successfully processed and acknowledged by client endpoint.
                  content:
                    text/plain:
                      examples:
                        ok:
                          value: ok
    parameters: []
components:
  schemas:
    batchValidationRequest:
      title: batchValidationRequest
      x-stoplight:
        id: batch-val-req-001
      description: Request payload for batch validation submission.
      type: object
      required:
        - control
        - data
      properties:
        control:
          $ref: '#/components/schemas/control'
        data:
          type: array
          description: Array of permit/address validation items. Maximum 50,000 records per submission.
          minItems: 1
          items:
            type: object
            required:
              - address
            properties:
              identifier:
                type: string
                description: The Short-Term Rental Permit/Registration Number (e.g. H1234567, S1234567, P1234567). If omitted, address exemption is evaluated.
                example: H1234567
              address:
                $ref: '#/components/schemas/address'
    batchValidationResultFile:
      title: batchValidationResultFile
      x-stoplight:
        id: batch-val-res-file-001
      description: The JSON payload structure downloaded from the presigned fileUrl.
      type: object
      required:
        - control
        - data
      properties:
        control:
          $ref: '#/components/schemas/control'
        data:
          type: array
          description: Array of evaluated records with validation statuses, address mismatch errors, or STRAA exemptions.
          items:
            $ref: '#/components/schemas/batchRecord'
    apiErrorResponse:
      title: apiErrorResponse
      x-stoplight:
        id: api-err-resp-001
      description: Standard API error response.
      type: object
      required:
        - errors
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/error'
    address:
      title: address
      description: 'Capture address information for an entity. If the country code is Canada or the US, city and postal code are required.'
      type: object
      x-examples:
        address-example-1:
          unitNumber: null
          streetNumber: '721'
          streetName: Fort St.
          city: Victoria
          province: BC
          country: CA
          postalCode: A1A 1A1
      required:
        - streetNumber
        - postalCode
      properties:
        unitNumber:
          type: string
          x-stoplight:
            id: h8zpkrtfo9otr
          pattern: '^[0-9]*[A-Za-z]?'
          example: 101a
        streetNumber:
          type: string
          x-stoplight:
            id: jrgzb5yhi8luf
          pattern: '^[0-9]*'
          example: '101'
        streetName:
          type: string
          description: 'Street address and name. '
          x-stoplight:
            id: vkj7vfcyw6kc6
        streetAdditional:
          type: string
          description: 'City, Town, or Village.'
          x-stoplight:
            id: 78128c30mv27f
        country:
          type: string
          minLength: 2
          maxLength: 2
          description: 2 Character ISO 3166-1 Alpha-2 Country Code.
        postalCode:
          type: string
          description: 'Postal Code in A1A 1A1 format for Canada, or zip code for US addresses.'
        province:
          type: string
          x-stoplight:
            id: our822cmejye6
        city:
          type: string
          x-stoplight:
            id: 2bzbl5ifh081k
    control:
      title: control
      x-stoplight:
        id: hnpfgpeh4ptc0
      type: object
      x-examples:
        batch-control:
          count: 1
          callBackUrl: 'http://example.com'
      description: Directives for the submission
      required:
        - count
        - callBackUrl
      properties:
        count:
          type: integer
          description: |-
            The total number of permits submitted for review.
            Used as a transmission check.
          x-stoplight:
            id: xhiwqb7mjcox2
          minimum: 1
        callBackUrl:
          type: string
          format: uri
          description: An URL to callback and POST the response for long running responses.
          x-stoplight:
            id: zyeuc87pxvxsl
    batchRecord:
      title: batchRecord
      x-stoplight:
        id: k5714a71jogf9
      type: object
      x-examples:
        Validation successful:
          identifier: H1234567
          status: ACTIVE
          address:
            unitNumber: 101a
            streetNumber: '101'
            streetName: Test st
            country: CA
            postalCode: H0H0H0
            province: BC
            city: Test
        Validation Error:
          identifier: H1234567
          address:
            unitNumber: 101a
            streetNumber: '101'
            streetName: Test St
            country: CA
            postalCode: H0H0H0
            province: BC
            city: Test
          errors:
            - code: STREET_NUMBER_MISMATCH
              message: Street number does not match with the data in the permit.
            - code: POSTAL_CODE_MISMATCH
              message: Postal code does not match with the data in the permit.
        STR Exempt:
          address:
            unitNumber: 101a
            streetNumber: '101'
            streetName: test st
            country: CA
            postalCode: H0H0H0
            province: BC
            city: Test
          isStraaExempt: true
      required:
        - address
      properties:
        identifier:
          type: string
          description: The registration number of the Permit
        status:
          enum:
            - ACTIVE
            - EXPIRED
            - SUSPENDED
            - CANCELLED
          description: The current status of the Permit
        address:
          $ref: '#/components/schemas/address'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/error'
        isStraaExempt:
          type: boolean
          x-stoplight:
            id: 321yvanazj3z9
    error:
      title: error
      x-stoplight:
        id: 55ddyc11ipxhv
      description: Error object.
      type: object
      x-examples:
        error:
          code: STREET_NUMBER_MISMATCH
          message: Street number does not match with the data in the permit.
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: STREET_NUMBER_MISMATCH
          description: Machine-readable error code.
          x-stoplight:
            id: wbr16i5f71u91
        message:
          type: string
          example: Street number does not match with the data in the permit.
          description: Human-readable error description.
          x-stoplight:
            id: vtsqsw0p96lnp
    addressRequirements:
      title: addressRequirements
      x-stoplight:
        id: n0699fszvtnml
      description: Short term rental requirements for an address.
      type: object
      x-examples:
        Example:
          isBusinessLicenceRequired: true
          isPrincipalResidenceRequired: true
          isStrProhibited: true
          isStraaExempt: true
      properties:
        isBusinessLicenceRequired:
          type: boolean
          x-stoplight:
            id: tw86vl4jl3dg7
        isPrincipalResidenceRequired:
          type: boolean
          x-stoplight:
            id: q473m1i7awkk6
        isStrProhibited:
          type: boolean
          x-stoplight:
            id: mmnwg5z5chhr0
        isStraaExempt:
          type: boolean
          x-stoplight:
            id: kju1p5kd0up0f
  securitySchemes:
    api_key:
      type: apiKey
      description: API Gateway assigned API key. Required for all requests.
      name: x-apikey
      in: header
    jwt:
      type: openIdConnect
      openIdConnectUrl: 'https://AUTH_PROVIDER/.well-known/openid-configuration'
  parameters:
    Account-Id:
      name: Account-Id
      in: header
      required: true
      schema:
        type: string
      description: The account that the user is operating on behalf of.
tags:
  - name: Draft
    description: The release state
  - name: Short Term Rental
    description: "Short-term rentals are defined under the Act as accommodations provided to members of the public in a host's property, in exchange for money, for a period of less than 90 consecutive days."
  - name: Verification
    description: The process of establishing the validity of a host's property as a qualified Short Term Rental
security:
  - api_key: []
