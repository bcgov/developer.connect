name: Developer Connect UI CI

on:
  pull_request:
    paths:
      - "web/site/**"
      - "packages/**"
  workflow_dispatch:

defaults:
  run:
    shell: bash
    working-directory: ./web/site

jobs:
  developer-connect-ui-ci:
    uses: pwei1018/bcregistry-sre/.github/workflows/frontend-ci.yaml@rollback-op
    with:
      app_name: "developer-connect-ui"
      working_directory: "./web/site"
      codecov_flag: "devloperconnectui"
      pnpm_version: 11.9.0
