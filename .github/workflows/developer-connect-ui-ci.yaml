name: Developer Connect UI CI

on:
  pull_request:
    paths:
      - "web/site/**"
      - "packages/**"
  workflow_dispatch:

defaults:
  run:
    shell: bash
    working-directory: ./web/site

jobs:
  developer-connect-ui-ci:
    uses: pwei1018/bcregistry-sre/.github/workflows/frontend-ci.yaml@rollback-op
    with:
      app_name: "developer-connect-ui"
      working_directory: "./web/site"
      codecov_flag: "devloperconnectui"
      pnpm_version: 11.9.0
      node_version: 24
  
  typecheck:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: pnpm/action-setup@v6
      with:
        version: 11.9.0
        run_install: false
    - uses: actions/setup-node@v6
      with:
        node-version: 24
        cache: 'pnpm'
    - name: Install dependencies
      run: pnpm install
    - name: Run Typecheck
      run: pnpm typecheck
