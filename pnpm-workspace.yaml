packages:
  - web/**
  - packages/**

catalog:
  '@axe-core/playwright': 4.13.0
  '@iconify-json/mdi': 1.2.3
  '@nuxt/test-utils': 4.3.3
  dotenv: 18.0.5
  typescript: 6.0.3
  vue-tsc: 3.3.13
  nuxt: 4.6.1
  vue: 3.5.43
  vue-router: 5.4.0
  '@types/node': 26.6.4
  '@faker-js/faker': 10.6.0

shamefullyHoist: true
strictPeerDependencies: false
minimumReleaseAge: 4320 # 3 days
minimumReleaseAgeExclude:
  - '@sbc-connect/*'
allowBuilds:
  "@parcel/watcher": true
  "@sbc-connect/nuxt-auth": true
  "@sbc-connect/nuxt-base": true
  "@sbc-connect/nuxt-forms": true
  "@sbc-connect/nuxt-pay": true
  "@tailwindcss/oxide": true
  better-sqlite3: true
  sqlite3: true
  esbuild: true
  unrs-resolver: true
  vue-demi: true

engineStrict: true

overrides:
  '@vueuse/core': 15.0.0
  '@vueuse/nuxt': 15.0.0
